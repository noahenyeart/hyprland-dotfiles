# ┃                  Decorations Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛


source = ~/.config/hypr/config/colors.conf

# https://wiki.hyprland.org/0.45.0/Configuring/Variables/#decoration

decoration {
	rounding = 10
	active_opacity = 1
	inactive_opacity = 1
	fullscreen_opacity = 1

	blur {
		enabled = false
		size = 6
		passes = 4
		new_optimizations = true
		ignore_opacity = true
		xray = false
		special = true
		popups = true
		contrast = 1.2				  #default 0.8916
	}

	shadow {
		enabled = false
		range = 30
		render_power = 3
		color = 0x66000000
	}
}

