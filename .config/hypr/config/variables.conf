# ┃                    Variables Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛


source = ~/.config/hypr/config/colors.conf


general {
    gaps_in = 5
    gaps_out = 0, 10, 10, 10
    border_size = 3
    col.active_border = $rosewater
    col.inactive_border = $surface0
    layout = master
    snap {
    		enabled = true
    }
}

group {
	col.border_active = $rosewater
	col.border_inactive = $surface0
	col.border_locked_active = $rosewater
	col.border_locked_inactive = $surface0
	groupbar {
		font_family = "Fira Sans"
		text_color = $text
		col.active = $rosewater
		col.inactive = $surface0
		col.locked_active = $rosewater
		col.locked_inactive = $surface0
	}
}

misc {
    font_family = "Fira Sans"
    splash_font_family = "Fira Sans"
    disable_hyprland_logo = true
    col.splash = $text
    background_color = $base
    enable_swallow = true
    swallow_regex = ^(firefox|nautilus.)$
    focus_on_activate = true
    vfr = true
    vrr = 1
    middle_click_paste = true
    animate_manual_resizes = true
}

render {
   # direct_scanout = 1
}

dwindle {
    special_scale_factor = 0.9
    pseudotile = true
    preserve_split = true
}

master {
    special_scale_factor = 0.9
}
