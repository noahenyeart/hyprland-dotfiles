# ┃                    Window Rules Configuration               ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛


## General Rules ##


# System Monitor #

windowrule = float, class:^(Status)$
windowrule = size 800 500, class:^(Status)$
windowrule = move 13 53, class:^(Status)$
windowrule = animation slide left, class:^(Status)$

# Calendar #

windowrule = float, class:^(khal-popup)$
windowrule = size 480 368, class:^(khal-popup)$
windowrule = move 784 53, class:^(khal-popup)$
windowrule = animation slide top, class:^(khal-popup)$
windowrule = stayfocused, class:^(khal-popup)$

# Audio, Network, Bluetooth #

windowrule = float, class:^(org.pulseaudio.pavucontrol)$
windowrule = move 100%-w-13 53, class:^(org.pulseaudio.pavucontrol)$
windowrule = animation slide right, class:^(org.pulseaudio.pavucontrol)$
windowrule = size 720 720, class:^(Gazelle)$
windowrule = float, class:^(Gazelle)$
windowrule = stayfocused, class:^(Gazelle)$
windowrule = move 100%-w-13 53, class:^(Gazelle)$
windowrule = animation slide right, class:^(Gazelle)$
windowrule = float, class:^(blueman-manager)$
windowrule = move 100%-w-13 53, class:^(blueman-manager)$
windowrule = animation slide right, class:^(blueman-manager)$

# PIP #

windowrule = float, title:^(Picture-in-Picture)$
windowrule = size 960 540, title:^(Picture-in-Picture)$
windowrule = move 25%-, title:^(Picture-in-Picture)$

# Popups #

windowrule = stayfocused, title:^(Albert)$
windowrule = stayfocused, class:^(polkit-gnome-authentication-agent-1)$
windowrule = stayfocused, class:^(gcr-prompter)$
windowrule = float, class:^()$,title:^(Picture in picture)$
windowrule = float, class:^()$,title:^(Save File)$
windowrule = size 720 480, title:^(Save File)$
windowrule = float, class:^()$,title:^(Open File)$
windowrule = size 720 480, title:^(Open File)$
windowrule = size 720 480, title:^(Pick Files)$
windowrule = size 720 480, title:^(Please choose a folder)$
windowrule = float, class:^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland)(.*)$
windowrule = float, class:^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org.org.kde.polkit-kde-authentication-agent-1)(.*)$
windowrule = float, class:^(zenity)$
windowrule = float, class:^()$,title:^(Steam - Self Updater)$

# Winboat #

windowrule = suppressevent fullscreen maximize activate activatefocus, class:^winboat-.*$


### Workspaces Rules ###


# Apps #

windowrule = workspace special, class:^(com.github.wwmm.easyeffects)$
windowrule = workspace special, class:^(spotify)$
windowrule = float, class:^(localsend)$
windowrule = size 480 640, class:^(localsend)$

# Monitors #

workspace = 1, default:true, monitor:DP-1
workspace = 1, default:true, monitor:DP-2
workspace = 1, default:true, monitor:HDMI-A-1


### Layer Rules ###


layerrule = animation slide top, logout_dialog
layerrule = blur, logout_dialog
layerrule = animation slide bottom, nwg-drawer
layerrule = blur, nwg-drawer
layerrule = animation slide top, waybar
