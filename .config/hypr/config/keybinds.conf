# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                           Keybinds                          ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛


# Launch Applications
bind = $mainMod, SPACE, exec, $launcher 									                                          # Open application launcher
bind = $mainMod, A, exec, $app_drawer                                                                                 # Open app drawer
bind = $mainMod, RETURN, exec, $terminal                                                                              # Open terminal
bind = $mainMod, B, exec, $browser                                                                                    # Open web browser
bind = $mainMod, F, exec, $filemanager                                                                                # Open file browser
bind = $mainMod, T, exec, $editor                                                                                     # Open text editor
bind = $mainMod, E, exec, easyeffects
bind = $mainMod, Y, exec, kitty yazi
#bind = $mainMod, L, exec, localsend

# Window Controls
bind = $mainMod, Q, killactive                                                                                        # Kill active window
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill                           # Quit active window and all open instances
bind = $mainMod SHIFT, F, fullscreen, 0                                                                               # Set active window to fullscreen
bind = $mainMod SHIFT, M, fullscreen, 1                                                                               # Maximize Window
bind = $mainMod SHIFT, T, togglefloating                                                                              # Toggle active window into floating mode...
bind = $mainMod SHIFT, T, resizeactive, exact 960 600                                                                 # ... and resize it
bind = $mainMod ALT, T, workspaceopt, allfloat                                                                        # Toggle all windows into floating mode
bind = $mainMod SHIFT, J, togglesplit                                                                                 # Toggle split
bind = $mainMod, left, movefocus, l                                                                                   # Move focus left
bind = $mainMod, right, movefocus, r                                                                                  # Move focus right
bind = $mainMod, up, movefocus, u                                                                                     # Move focus up
bind = $mainMod, down, movefocus, d                                                                                   # Move focus down
bind = $mainMod SHIFT, left, swapwindow, l                                                                            # Swap tiled window left
bind = $mainMod SHIFT, right, swapwindow, r                                                                           # Swap tiled window right
bind = $mainMod SHIFT, up, swapwindow, u                                                                              # Swap tiled window up
bind = $mainMod SHIFT, down, swapwindow, d                                                                            # Swap tiled window down
bindm = $mainMod, mouse:272, movewindow                                                                               # Move window with the mouse
bindm = $mainMod SHIFT, mouse:272, resizewindow                                                                       # Resize window with the mouse
bind = $mainMod ALT, right, resizeactive, 100 0                                                                       # Increase window width with keyboard
bind = $mainMod ALT, left, resizeactive, -100 0                                                                       # Reduce window width with keyboard
bind = $mainMod ALT, down, resizeactive, 0 100                                                                        # Increase window height with keyboard
bind = $mainMod ALT, up, resizeactive, 0 -100                                                                         # Reduce window height with keyboard
bind = $mainMod, G, togglegroup                                                                                       # Toggle window group
#bind = $mainMod, K, swapsplit                                                                                         # Swap split
binde = $mainMod, Tab, cyclenext                                                                                      # Cycle between windows
binde = $mainMod, Tab, bringactivetotop                                                                               # Bring active window to the top

# Vim Key Navigation
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d
bind = $mainMod ALT, L, resizeactive, 100 0
bind = $mainMod ALT, H, resizeactive, -100 0
bind = $mainMod ALT, J, resizeactive, 0 100
bind = $mainMod ALT, K, resizeactive, 0 -100

# Actions
bind = $mainMod CTRL, R, exec, hyprctl reload                                                                         # Reload Hyprland configuration
bind = $mainMod, W, exec, ~/.config/hypr/scripts/kill-waybar.sh || ~/.config/hypr/scripts/start-waybar.sh             # Toggle waybar
bind = $mainMod SHIFT, W, exec, pkill waybar && waybar                                                                # Reload waybar
bind = $mainMod ALT, W, exec, waypaper --random                                                                       # Change the wallpaper
bind = $mainMod CTRL, W, exec, waypaper --restore &                                                                   # Restore wallpaper selection to all monitors
bind = $mainMod, PRINT, exec, $capturing                                                                              # Take a screenshot
bind = $mainMod, C, exec, $capturing                                                                                  # Take a screenshot

# Workspace Controls
bind = $mainMod, 1, workspace, 1                                                                                      # Open workspace 1
bind = $mainMod, 2, workspace, 2                                                                                      # Open workspace 2
bind = $mainMod, 3, workspace, 3                                                                                      # Open workspace 3
bind = $mainMod, 4, workspace, 4                                                                                      # Open workspace 4
bind = $mainMod, 5, workspace, 5                                                                                      # Open workspace 5
bind = $mainMod, 6, workspace, 6                                                                                      # Open workspace 6
bind = $mainMod, 7, workspace, 7                                                                                      # Open workspace 7
bind = $mainMod, 8, workspace, 8                                                                                      # Open workspace 8
bind = $mainMod, 9, workspace, 9                                                                                      # Open workspace 9
bind = $mainMod, 0, workspace, 10                                                                                     # Open workspace 10
bind = $mainMod, S, togglespecialworkspace                                                                            # Toggle Special Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1                                                                          # Move active window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2                                                                          # Move active window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3                                                                          # Move active window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4                                                                          # Move active window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5                                                                          # Move active window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6                                                                          # Move active window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7                                                                          # Move active window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8                                                                          # Move active window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9                                                                          # Move active window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10                                                                         # Move active window to workspace 10
bind = $mainMod SHIFT, S, movetoworkspace, special                                                                    # Move active window to special workspace
bind = $mainMod CTRL, right, workspace, m+1                                                                           # Open next workspace
bind = $mainMod CTRL, left, workspace, m-1                                                                            # Open previous workspace
bind = $mainMod, mouse_down, workspace, e+1                                                                           # Open next workspace
bind = $mainMod, mouse_up, workspace, e-1                                                                             # Open previous workspace
# bind = $mainMod CTRL, down, workspace, empty                                                                        # Open the next empty workspace

# Fn keys
bind = , XF86MonBrightnessUp, exec, brightnessctl -d intel_backlight -q s +5%                                         # Increase brightness by 5%
bind = , XF86MonBrightnessDown, exec, brightnessctl -d intel_backlight -q s 5%-                                       # Reduce brightness by 5%
# bind = CTRL, XF86MonBrightnessUp, exec, brightnessctl -q s +5%
# bind = CTRL, XF86MonBrightnessDown, exec, brightnessctl -q s 5%-
bind = $mainMod, XF86MonBrightnessUp, exec, pkill hyprsunset
bind = $mainMod, XF86MonBrightnessDown, exec, hyprsunset -t 3500
binde = , XF86AudioRaiseVolume, exec, pactl set-sink-mute @DEFAULT_SINK@ 0 && pactl set-sink-volume @DEFAULT_SINK@ +5%                                        # Increase volume by 5%
binde = , XF86AudioLowerVolume, exec, pactl set-sink-mute @DEFAULT_SINK@ 0 && pactl set-sink-volume @DEFAULT_SINK@ -5%                                        # Reduce volume by 5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle                                                                                      # Toggle mute
bind = , XF86AudioPlay, exec, playerctl play-pause                                                                                                           # Audio play pause
bind = , XF86AudioPause, exec, playerctl pause                                                                                                               # Audio pause
bind = , XF86AudioNext, exec, playerctl next                                                                                                                 # Audio next
bind = , XF86AudioPrev, exec, playerctl previous                                                                                                             # Audio previous
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle                                                                               # Toggle microphone
bind = , XF86Lock, exec, hyprlock                                                                                                                            # Open screenlock
bind = , code:238, exec, brightnessctl -d smc::kbd_backlight s +10
bind = , code:237, exec, brightnessctl -d smc::kbd_backlight s 10-
